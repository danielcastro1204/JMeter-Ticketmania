name: Pruebas de rendimiento

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar JMeter 5.6.3
        run: |
          curl -fsSL -o jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf jmeter.tgz -C "$HOME"
          echo "$HOME/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Levantar la API en el puerto 8080
        run: |
          nohup python3 api/ticketmania_simple.py > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/api/salud | grep -q '"OK"'; then
              echo "API arriba"; exit 0
            fi
            sleep 1
          done
          echo "La API no respondió en /api/salud"; cat api.log; exit 1

      - name: Ejecutar JMeter (no-GUI)
        working-directory: pruebas/jmeter
        run: |
          jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      - name: Decidir resultado (falla si hay peticiones fallidas)
        working-directory: pruebas/jmeter
        run: |
          fallidas=$(python3 - <<'PY'
          import csv
          print(sum(1 for r in csv.DictReader(open("resultados.jtl")) if r["success"] != "true"))
          PY
          )
          total=$(($(wc -l < resultados.jtl) - 1))
          echo "Peticiones: $total | Fallidas: $fallidas"
          if [ "$fallidas" -gt 0 ]; then
            echo "::error::Hay $fallidas peticiones fallidas"
            exit 1
          fi

      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento
          path: pruebas/jmeter/reporte
